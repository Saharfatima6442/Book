
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - COHERE_API_KEY=${COHERE_API_KEY}
      - QDRANT_URL=http://qdrant:6333  # Use the service name within the Docker network
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - NEON_DB_URL=${NEON_DB_URL}
      - NEON_API_KEY=${NEON_API_KEY}
    env_file:
      - ./backend/.env
    depends_on:
      - qdrant
    networks:
      - ai_book_network

  frontend:
    build:
      context: ./AI-Book
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - ai_book_network

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai_book_network

volumes:
  qdrant_data:

networks:
  ai_book_network:
    driver: bridge